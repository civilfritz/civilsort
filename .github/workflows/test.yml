name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: nilaway
        run: go tool nilaway -include-pkgs=github.com/civilfritz/civilsort ./...

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run tests
        run: go test -v -race ./...

      - name: Build
        run: make build
