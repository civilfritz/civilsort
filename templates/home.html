<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create a Ballot - civilsort</title>
    <script>
    (function() {
        var saved = localStorage.getItem('theme');
        if (saved) {
            document.documentElement.dataset.theme = saved;
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.dataset.theme = 'dark';
        }
    })();
    </script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
<div class="container home">
    <div class="home-header">
        <div class="menu-wrapper" id="menu-wrapper">
            <button class="hamburger-menu" id="hamburger-menu" aria-label="Menu">☰</button>
            <div class="menu-dropdown" id="menu-dropdown">
                <nav class="menu-nav">
                    <button class="menu-item theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">Light/Dark</button>
                    <a href="/about" class="menu-item">About</a>
                </nav>
            </div>
        </div>
    </div>
    <h1>civilsort</h1>
    <p>Sort it out together.</p>

    <form method="POST" action="/" class="create-ballot-form">
        <label for="title">Ballot Title (optional)</label>
        <input type="text" id="title" name="title" placeholder="e.g., Friday Lunch Vote" maxlength="200">

        <button type="submit">Create Ballot</button>
    </form>
</div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
