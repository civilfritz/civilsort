<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ballot Closed - civilsort</title>
    <script>
    (function() {
        var saved = localStorage.getItem('theme');
        if (saved) {
            document.documentElement.dataset.theme = saved;
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.dataset.theme = 'dark';
        }
    })();
    </script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
<div class="container home">
    <div class="home-header">
        <div class="menu-wrapper" id="menu-wrapper">
            <button class="hamburger-menu" id="hamburger-menu" aria-label="Menu">☰</button>
            <div class="menu-dropdown" id="menu-dropdown">
                <nav class="menu-nav">
                    <a href="/" class="menu-item">Home</a>
                    <button class="menu-item theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">Light/Dark</button>
                    <a href="/about" class="menu-item">About</a>
                </nav>
            </div>
        </div>
    </div>
    <h1>Ballot Closed</h1>
    <p>This ballot is currently closed to new participants.</p>
    <p><a href="/">Create your own ballot</a></p>
</div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
